name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Restore executable permissions
        run: chmod +x run_local.sh scripts/*.py

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Install headless Chromium for isolated application flow
        run: python -m playwright install --with-deps --only-shell chromium

      - name: Verify dependency consistency
        run: python -m pip check

      - name: Compile Python sources
        run: python -m compileall -q app scripts tests

      - name: Run tests
        run: python -m pytest -q

  production_seo_smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install smoke-test HTTP client
        run: python -m pip install httpx==0.28.1
      - name: Verify deployed public SEO routes
        run: python scripts/seo_smoke_test.py
