<details><summary>{{ t('assessment_optional') }}</summary><p>{{ t('assessment_note') }}</p>{% for i in range(1,4) %}{% set supplier=item.draft.get('suppliers',[])[i-1] if item.draft.get('suppliers',[])|length>=i else {} %}<fieldset><legend>{{ t('supplier_name') }} {{ i }}</legend><label>{{ t('supplier_name') }}<input name="supplier_{{ i }}_name" maxlength="200" value="{{ supplier.get('name','') }}"></label><label>{{ t('supplier_role') }}<select name="supplier_{{ i }}_role">{% for value in ['unknown_role','manufacturer','reseller'] %}<option value="{{ value }}" {% if supplier.get('role')==value %}selected{% endif %}>{{ t(value) }}</option>{% endfor %}</select></label><label>{{ t('assessment_outcome') }}<select name="supplier_{{ i }}_outcome">{% for value in ['insufficient','concerns','documented'] %}<option value="{{ value }}" {% if supplier.get('outcome')==value %}selected{% endif %}>{{ t(value) }}</option>{% endfor %}</select></label><label>{{ t('checked_on') }}<input type="date" name="supplier_{{ i }}_checked_on" value="{{ supplier.get('checked_on','') }}"></label><label>{{ t('assessment_notes') }}<textarea name="supplier_{{ i }}_notes" maxlength="5000">{{ supplier.get('notes','') }}</textarea></label><label>{{ t('sources_hint') }}<textarea name="supplier_{{ i }}_sources" maxlength="10000">{{ supplier.get('sources',[])|join('
') }}</textarea></label><label>{{ t('archive') }}<select name="supplier_{{ i }}_archive">{% for value in ['not_checked','not_found','found'] %}<option value="{{ value }}" {% if supplier.get('archive')==value %}selected{% endif %}>{{ t(value) }}</option>{% endfor %}</select></label><label>{{ t('archive_url') }}<input name="supplier_{{ i }}_archive_url" maxlength="2000" value="{{ supplier.get('archive_url','') }}"></label><label>{{ t('archive_date') }}<input type="date" name="supplier_{{ i }}_archive_date" value="{{ supplier.get('archive_date','') }}"></label></fieldset>{% endfor %}<p>{{ t('archive_note') }}</p></details>
