{% extends 'sourcing/base.html' %}{% block content %}<h1>{{ t('feedback') }}</h1><p>{{ t('feedback_intro') }}</p><form method="post" action="/sourcing/feedback"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><input type="hidden" name="submission" value="{{ submission }}"><input type="hidden" name="request_id" value="{{ request_id }}"><div class="trap" aria-hidden="true"><input name="website" tabindex="-1" autocomplete="off"></div><label>{{ t('feedback_kind') }}<select name="kind">{% for key in ['review','bug','suggestion'] %}<option value="{{ key }}">{{ t(key) }}</option>{% endfor %}</select></label><label>{{ t('rating') }}<select name="rating"><option value="">{{ t('no_rating') }}</option>{% for score in range(1,6) %}<option value="{{ score }}">{{ score }} / 5</option>{% endfor %}</select></label><label>{{ t('feedback_message') }}<textarea name="message" required minlength="10" maxlength="3000" aria-describedby="feedbackHelp"></textarea></label><p id="feedbackHelp">{{ t('feedback_help') }}</p><label><input type="checkbox" name="consent" value="yes" required>{{ t('feedback_consent') }}</label><label><input type="checkbox" name="publish_consent" value="yes">{{ t('publish_consent') }}</label>{% if turnstile_site_key %}<div class="cf-turnstile" data-sitekey="{{ turnstile_site_key }}" data-language="{{ lang }}"></div>{% endif %}<button>{{ t('send_feedback') }}</button></form>{% endblock %}{% block scripts %}{% if turnstile_site_key %}<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>{% endif %}{% endblock %}
